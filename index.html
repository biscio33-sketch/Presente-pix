<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4d6">
  <title>Consulta do presente PIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(135deg,#fff2c6,#ffe1ec 55%,#dff4ff);
      color: #172554; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main {
      width: min(100%, 430px); padding: 34px 26px; text-align: center;
      background: #fff; border: 3px solid #ffc629; border-radius: 24px;
      box-shadow: 0 14px 40px rgba(23,37,84,.13);
    }
    .icon { font-size: 48px; margin-bottom: 10px; }
    .tag {
      display: inline-block; padding: 7px 13px; border-radius: 999px;
      background: #e8f2ff; color: #1d4ed8; font-size: 13px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
    }
    h1 { margin: 20px 0 12px; font-size: clamp(30px,8vw,40px); line-height: 1.08; }
    p { margin: 12px 0; color: #475569; font-size: 18px; line-height: 1.5; }
    .number {
      margin-top: 18px; padding: 15px 12px; border-radius: 14px;
      background: #fff3cd; color: #92400e; font-weight: 800; font-size: 21px;
    }
    small { display: block; margin-top: 24px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🎁</div>
    <span class="tag">Consulta de presente PIX</span>
    <h1>Saldo insuficiente!</h1>
    <p>Dúvidas? Ligar no número abaixo:</p>
    <div class="number">Sem número disponível.</div>
    <small>Erro 404 · Presente temporariamente indisponível 😉</small>
  </main>
</body>
</html>
