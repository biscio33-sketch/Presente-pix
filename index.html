<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Presente para Mamis 🎁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a0f2e;
      --bg-mid: #2d1b4e;
      --rose: #ff6b9d;
      --gold: #f0c75e;
      --cream: #fff8f0;
      --ink: #1e1333;
      --muted: #6b5a7a;
      --card: #fffdfb;
      --warn-bg: #fff4e0;
      --warn-ink: #8a5a12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background: var(--bg-deep);
      color: var(--cream);
      font-family: "Outfit", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .scene-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #12081f;
    }

    .scene-photo::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(88vw, 400px);
      height: min(55vw, 260px);
      translate: -50% -50%;
      background: url("assets/familia.jpg") center / contain no-repeat;
      filter: saturate(0.75) brightness(0.55) contrast(1.05);
      opacity: 0.55;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 30%, transparent 75%);
    }

    .scene-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 85% 70% at 50% 40%, rgba(26, 15, 46, 0.2), rgba(18, 8, 31, 0.85) 72%),
        linear-gradient(180deg, rgba(18, 8, 31, 0.45), rgba(18, 8, 31, 0.8));
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 50% 45%, transparent 30%, rgba(26, 15, 46, 0.55) 100%),
        linear-gradient(180deg, rgba(26, 15, 46, 0.35) 0%, transparent 25%, transparent 70%, rgba(26, 15, 46, 0.5) 100%);
    }

    /* —— Intro —— */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      overflow: hidden;
      background: #12081f;
      transition: opacity 0.9s ease, visibility 0.9s;
    }

    #intro.hiding {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .intro-photo {
      position: absolute;
      left: 50%;
      top: 36%;
      width: min(92vw, 420px);
      height: min(58vw, 280px);
      translate: -50% -50%;
      background:
        url("assets/familia.jpg") center / contain no-repeat;
      filter: saturate(0.9) contrast(1.05);
      opacity: 0.7;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 35%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 35%, transparent 75%);
      animation: photo-ken 28s ease-in-out infinite alternate;
    }

    .intro-photo-veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(18, 8, 31, 0.45) 0%,
          rgba(26, 15, 46, 0.2) 32%,
          rgba(26, 15, 46, 0.45) 58%,
          rgba(18, 8, 31, 0.9) 100%),
        radial-gradient(ellipse 80% 70% at 50% 40%,
          rgba(255, 107, 157, 0.1),
          transparent 65%);
    }

    .intro-aurora {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 55% 40% at 50% 18%, rgba(255, 107, 157, 0.28), transparent 60%),
        radial-gradient(ellipse 45% 35% at 20% 70%, rgba(120, 80, 220, 0.28), transparent 55%),
        radial-gradient(ellipse 40% 30% at 85% 55%, rgba(240, 199, 94, 0.16), transparent 50%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(45, 20, 70, 0.55), transparent 55%);
      animation: aurora-drift 12s ease-in-out infinite alternate;
      filter: blur(8px);
      mix-blend-mode: soft-light;
      opacity: 0.85;
    }

    .intro-mesh {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 248, 240, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 248, 240, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
    }

    .intro-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      animation: orb-float 9s ease-in-out infinite;
    }

    .intro-orb.a {
      width: 42vw;
      height: 42vw;
      max-width: 280px;
      max-height: 280px;
      top: 8%;
      left: 50%;
      translate: -50% 0;
      background: radial-gradient(circle, rgba(255, 140, 180, 0.55), transparent 70%);
      animation-delay: 0s;
    }

    .intro-orb.b {
      width: 55vw;
      height: 55vw;
      max-width: 340px;
      max-height: 340px;
      bottom: 5%;
      left: -10%;
      background: radial-gradient(circle, rgba(140, 90, 255, 0.4), transparent 70%);
      animation-delay: -3s;
      animation-duration: 11s;
    }

    .intro-orb.c {
      width: 40vw;
      height: 40vw;
      max-width: 240px;
      max-height: 240px;
      bottom: 18%;
      right: -8%;
      background: radial-gradient(circle, rgba(240, 199, 94, 0.35), transparent 70%);
      animation-delay: -5s;
      animation-duration: 10s;
    }

    .intro-stars {
      position: absolute;
      inset: 0;
    }

    .intro-star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff8f0;
      opacity: 0;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      box-shadow: 0 0 6px rgba(240, 199, 94, 0.8);
    }

    .intro-star.gold { background: var(--gold); }
    .intro-star.rose { background: var(--rose); width: 2px; height: 2px; }

    .intro-rays {
      position: absolute;
      left: 50%;
      top: 28%;
      width: 140vmax;
      height: 140vmax;
      translate: -50% -50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(240, 199, 94, 0.06) 8deg,
        transparent 16deg,
        transparent 40deg,
        rgba(255, 107, 157, 0.05) 48deg,
        transparent 56deg,
        transparent 100deg,
        rgba(240, 199, 94, 0.05) 108deg,
        transparent 116deg
      );
      animation: rays-spin 48s linear infinite;
      opacity: 0;
      transition: opacity 1.4s ease 0.3s;
    }

    #intro.lit .intro-rays { opacity: 1; }

    .intro-inner {
      position: relative;
      z-index: 2;
      width: min(100%, 22rem);
      text-align: center;
    }

    .intro-seal {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.6rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.9s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .intro-seal.visible {
      opacity: 1;
      transform: scale(1);
    }

    .intro-seal::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(240, 199, 94, 0.35);
      animation: seal-ring 3.2s ease-in-out infinite;
    }

    .intro-seal::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 45%),
        linear-gradient(145deg, #ff8fb3, #c94b6a 50%, #8a3a5a);
      box-shadow:
        0 0 0 1px rgba(240, 199, 94, 0.5),
        0 12px 40px rgba(255, 107, 157, 0.35),
        inset 0 -6px 16px rgba(0, 0, 0, 0.25);
    }

    .intro-seal svg {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 34px;
      color: var(--gold);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }

    .intro-kicker {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(240, 199, 94, 0.85);
      margin-bottom: 1.1rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .intro-kicker.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .intro-line {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.15rem, 9vw, 3.1rem);
      font-weight: 600;
      font-style: italic;
      line-height: 1.18;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-shadow:
        0 0 40px rgba(255, 107, 157, 0.25),
        0 2px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 1.15s ease, transform 1.15s ease;
    }

    .intro-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .intro-line .mamis {
      display: block;
      background: linear-gradient(120deg, #fff8f0 20%, #f0c75e 45%, #ffb0c8 70%, #fff8f0 95%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 4.5s ease-in-out infinite;
    }

    .intro-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 1.35rem auto 0;
      width: min(100%, 16rem);
      opacity: 0;
      transform: scaleX(0.4);
      transition: opacity 0.9s ease, transform 1s ease;
    }

    .intro-divider.visible {
      opacity: 1;
      transform: scaleX(1);
    }

    .intro-divider span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(240, 199, 94, 0.7), transparent);
    }

    .intro-divider i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(240, 199, 94, 0.8);
      flex-shrink: 0;
    }

    .intro-from {
      margin-top: 1rem;
      font-family: "Outfit", sans-serif;
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 0.045em;
      line-height: 1.5;
      color: rgba(255, 232, 210, 0.9);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .intro-from.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cta {
      margin-top: 2.4rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.9s ease 0.1s, transform 0.9s ease 0.1s;
    }

    .cta.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cta button {
      appearance: none;
      border: none;
      border-radius: 999px;
      background:
        linear-gradient(135deg, rgba(240, 199, 94, 0.95), rgba(255, 170, 120, 0.9) 45%, rgba(255, 107, 157, 0.92));
      color: #1a0f2e;
      font-family: "Outfit", sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 17px 32px;
      min-height: 54px;
      min-width: 13rem;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255, 248, 240, 0.25) inset,
        0 10px 36px rgba(255, 107, 157, 0.35),
        0 0 40px rgba(240, 199, 94, 0.2);
      -webkit-tap-highlight-color: transparent;
      animation: cta-glow 2.4s ease-in-out infinite;
    }

    .cta button:active {
      transform: scale(0.97);
      filter: brightness(1.05);
    }

    .cta .pulse {
      display: block;
      width: 8px;
      height: 8px;
      margin: 18px auto 0;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 0 rgba(255, 107, 157, 0.55);
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 157, 0.55); }
      70% { box-shadow: 0 0 0 14px rgba(255, 107, 157, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 157, 0); }
    }

    @keyframes aurora-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(0, -2%) scale(1.05); }
    }

    @keyframes photo-ken {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.05) translate(0, -1%); }
    }

    @media (min-width: 640px) {
      .intro-photo {
        width: min(70vw, 520px);
        height: min(42vw, 340px);
        opacity: 0.75;
      }
    }

    @keyframes orb-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.85; }
      50% { transform: translateY(-18px) scale(1.08); opacity: 1; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    @keyframes rays-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes seal-ring {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 0.25; }
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes cta-glow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255, 248, 240, 0.25) inset, 0 10px 36px rgba(255, 107, 157, 0.3), 0 0 30px rgba(240, 199, 94, 0.15); }
      50% { box-shadow: 0 0 0 1px rgba(255, 248, 240, 0.35) inset, 0 12px 42px rgba(255, 107, 157, 0.45), 0 0 50px rgba(240, 199, 94, 0.3); }
    }

    /* —— Hint after intro —— */
    #hint {
      position: fixed;
      bottom: max(32px, calc(env(safe-area-inset-bottom) + 20px));
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    #hint.show {
      opacity: 1;
      transform: translateY(0);
    }

    #hint.hide {
      opacity: 0;
      transform: translateY(8px);
    }

    #hint span {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(26, 15, 46, 0.45);
      backdrop-filter: blur(8px);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 248, 240, 0.85);
    }

    /* —— Reveal card —— */
    #reveal {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: end center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #reveal.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .card {
      width: min(100%, 22rem);
      margin: auto;
      padding: 28px 20px 22px;
      text-align: center;
      background: var(--card);
      color: var(--ink);
      border-radius: 24px;
      box-shadow:
        0 4px 6px rgba(26, 15, 46, 0.06),
        0 24px 60px rgba(26, 15, 46, 0.35),
        0 0 0 1px rgba(240, 199, 94, 0.25);
      transform: scale(0.92) translateY(36px);
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: text;
    }

    #reveal.show .card {
      transform: scale(1) translateY(0);
    }

    .card-ribbon {
      width: 40px;
      height: 4px;
      margin: 0 auto 16px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--rose), var(--gold));
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f3eef8;
      color: #6b4a8a;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card h1 {
      margin: 14px 0 8px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.85rem, 8vw, 2.4rem);
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink);
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .qr-wrap {
      margin: 18px auto 6px;
      width: min(52vw, 180px);
      height: min(52vw, 180px);
      padding: 10px;
      background: #fff;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(30, 19, 51, 0.08);
    }

    .qr-wrap canvas,
    .qr-wrap img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .qr-label {
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .err {
      margin-top: 16px;
      font-size: 0.68rem;
      color: #a89bb0;
    }

    @media (min-width: 640px) {
      .intro-inner { width: min(100%, 30rem); }
      .intro-seal { width: 84px; height: 84px; margin-bottom: 1.8rem; }
      .intro-seal svg { width: 40px; height: 40px; }
      .card {
        width: min(100%, 24rem);
        padding: 36px 28px 28px;
        border-radius: 28px;
      }
      #reveal { place-items: center; }
      .cta button { font-size: 0.9rem; }
    }

    .sparkles {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .sparkles.on { opacity: 1; }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-line, .cta, .card, #hint, #intro, #reveal,
      .intro-seal, .intro-kicker, .intro-divider {
        transition: none !important;
      }
      .cta .pulse,
      .intro-aurora,
      .intro-orb,
      .intro-star,
      .intro-rays,
      .intro-seal::before,
      .intro-line .mamis,
      .intro-photo,
      .cta button {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene-photo" aria-hidden="true"></div>
  <div id="canvas-wrap" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <section id="intro" aria-live="polite">
    <div class="intro-bg" aria-hidden="true">
      <div class="intro-photo"></div>
      <div class="intro-photo-veil"></div>
      <div class="intro-aurora"></div>
      <div class="intro-orb a"></div>
      <div class="intro-orb b"></div>
      <div class="intro-orb c"></div>
      <div class="intro-mesh"></div>
      <div class="intro-rays"></div>
      <div class="intro-stars" id="intro-stars"></div>
    </div>
    <div class="intro-inner">
      <div class="intro-seal" id="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2c.4 0 .7.2.9.5l1.4 2.4 2.7.5c.7.1 1 .9.5 1.4l-1.9 2 .4 2.8c.1.7-.6 1.2-1.2.9L12 11.7l-2.8 1.3c-.6.3-1.3-.2-1.2-.9l.4-2.8-1.9-2c-.5-.5-.2-1.3.5-1.4l2.7-.5L11.1 2.5c.2-.3.5-.5.9-.5z"/>
          <path d="M7.5 14.2c1.3-.4 2.8-.2 4 .6.4.3.9.3 1.3 0 1.2-.8 2.7-1 4-.6.5.2 1 .7.9 1.2l-.4 2.1c-.1.5-.5.9-1 .9H7.9c-.5 0-.9-.4-1-.9l-.4-2.1c-.1-.5.4-1 .9-1.2z" opacity=".9"/>
        </svg>
      </div>
      <p class="intro-kicker" id="kicker">Um presente especial</p>
      <p class="intro-line" id="msg">
        Parabéns
        <span class="mamis">mamis</span>
      </p>
      <div class="intro-divider" id="divider" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>
      <p class="intro-from" id="names">de Lu, Vi, Pai, Laisa e Jackie</p>
      <div class="cta" id="cta">
        <button type="button" id="open-btn">Toque para abrir</button>
        <span class="pulse" aria-hidden="true"></span>
      </div>
    </div>
  </section>

  <div id="hint"><span>Toque no presente</span></div>

  <section id="reveal" aria-live="polite">
    <article class="card">
      <div class="card-ribbon" aria-hidden="true"></div>
      <span class="tag">Consulta de presente PIX</span>
      <h1>Saldo insuficiente!</h1>
      <p>Dúvidas? Escaneie o QR code abaixo.</p>
      <div class="qr-wrap" id="qr" role="img" aria-label="QR code"></div>
      <p class="qr-label">Central de atendimento</p>
      <p class="err">Erro 404 · Presente temporariamente indisponível 😉</p>
    </article>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";

    const CALL_URL = "https://call.whatsapp.com/video/4HIwvSel7AJSY64W4UNIlh";

    // —— QR code (no extra dependency) ——
    async function renderQR(el, text) {
      const size = 296;
      const api = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=8&data=${encodeURIComponent(text)}`;
      const img = document.createElement("img");
      img.src = api;
      img.alt = "QR code WhatsApp";
      img.width = size;
      img.height = size;
      el.appendChild(img);
    }

    renderQR(document.getElementById("qr"), CALL_URL);

    // —— Intro sequence ——
    const intro = document.getElementById("intro");
    const msg = document.getElementById("msg");
    const cta = document.getElementById("cta");
    const openBtn = document.getElementById("open-btn");
    const hint = document.getElementById("hint");
    const reveal = document.getElementById("reveal");
    const sparkles = document.getElementById("sparkles");
    const seal = document.getElementById("seal");
    const kicker = document.getElementById("kicker");
    const divider = document.getElementById("divider");
    const names = document.getElementById("names");
    const introStars = document.getElementById("intro-stars");

    let phase = "intro"; // intro | gift | opened
    let giftReady = false;

    // Seed intro stars once
    {
      const kinds = ["", "gold", "rose"];
      for (let i = 0; i < 28; i++) {
        const s = document.createElement("span");
        s.className = "intro-star " + kinds[i % kinds.length];
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.setProperty("--dur", 2.2 + Math.random() * 3.5 + "s");
        s.style.setProperty("--delay", Math.random() * 3 + "s");
        introStars.appendChild(s);
      }
    }

    requestAnimationFrame(() => {
      intro.classList.add("lit");
      setTimeout(() => seal.classList.add("visible"), 120);
      setTimeout(() => kicker.classList.add("visible"), 420);
      setTimeout(() => msg.classList.add("visible"), 700);
      setTimeout(() => divider.classList.add("visible"), 1100);
      setTimeout(() => names.classList.add("visible"), 1300);
      setTimeout(() => cta.classList.add("visible"), 1800);
    });

    // —— Three.js scene ——
    const wrap = document.getElementById("canvas-wrap");
    const isMobile = () => window.matchMedia("(max-width: 640px), (pointer: coarse)").matches;
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0f2e, 0.028);

    const camera = new THREE.PerspectiveCamera(isMobile() ? 48 : 42, 1, 0.1, 100);
    function setGiftCamera(idle = true) {
      const mobile = isMobile();
      if (idle) {
        camera.position.set(0, mobile ? 2.6 : 2.2, mobile ? 7.4 : 6.5);
        camera.lookAt(0, mobile ? 0.85 : 0.6, 0);
      } else {
        camera.position.set(0, mobile ? 2.1 : 1.8, mobile ? 5.8 : 5.2);
        camera.lookAt(0, mobile ? 0.85 : 0.7, 0);
      }
    }
    setGiftCamera(true);

    const renderer = new THREE.WebGLRenderer({ antialias: !isMobile(), alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile() ? 1.75 : 2));
    renderer.shadowMap.enabled = !isMobile();
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffe8f4, 0.55);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xfff0dd, 1.35);
    key.position.set(4, 8, 5);
    key.castShadow = !isMobile();
    key.shadow.mapSize.set(isMobile() ? 512 : 1024, isMobile() ? 512 : 1024);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 20;
    key.shadow.camera.left = -5;
    key.shadow.camera.right = 5;
    key.shadow.camera.top = 5;
    key.shadow.camera.bottom = -5;
    scene.add(key);

    const rim = new THREE.PointLight(0xff6b9d, 18, 20);
    rim.position.set(-3, 2, -2);
    scene.add(rim);

    const goldLight = new THREE.PointLight(0xf0c75e, 12, 16);
    goldLight.position.set(2.5, 3, 2);
    scene.add(goldLight);

    // Floor (soft so family photo shows through)
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({
        color: 0x241438,
        roughness: 0.9,
        metalness: 0.05,
        transparent: true,
        opacity: 0.55,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Soft glow disc under gift
    const glow = new THREE.Mesh(
      new THREE.CircleGeometry(1.4, 48),
      new THREE.MeshBasicMaterial({
        color: 0xff6b9d,
        transparent: true,
        opacity: 0.18,
      })
    );
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = 0.02;
    scene.add(glow);

    // —— Gift box ——
    const gift = new THREE.Group();
    gift.position.set(0, 0, 0);
    gift.scale.setScalar(0);
    scene.add(gift);

    const BOX_W = 1.5;
    const BOX_H = 1.15;
    const BOX_D = 1.5;
    const LID_H = 0.28;
    const RIBBON = 0.18;

    const boxMat = new THREE.MeshStandardMaterial({
      color: 0xc94b6a,
      roughness: 0.45,
      metalness: 0.15,
    });
    const ribbonMat = new THREE.MeshStandardMaterial({
      color: 0xf0c75e,
      roughness: 0.35,
      metalness: 0.4,
    });
    const lidMat = boxMat.clone();

    const boxBody = new THREE.Group();
    const bodyMesh = new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W, BOX_H, BOX_D),
      boxMat
    );
    bodyMesh.position.y = BOX_H / 2;
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    boxBody.add(bodyMesh);

    // Ribbon bands on body
    const bandX = new THREE.Mesh(
      new THREE.BoxGeometry(RIBBON, BOX_H + 0.02, BOX_D + 0.02),
      ribbonMat
    );
    bandX.position.y = BOX_H / 2;
    bandX.castShadow = true;
    boxBody.add(bandX);

    const bandZ = new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W + 0.02, BOX_H + 0.02, RIBBON),
      ribbonMat
    );
    bandZ.position.y = BOX_H / 2;
    bandZ.castShadow = true;
    boxBody.add(bandZ);

    gift.add(boxBody);

    // Lid (pivots from back edge)
    const lidPivot = new THREE.Group();
    lidPivot.position.set(0, BOX_H, -BOX_D / 2);
    gift.add(lidPivot);

    const lid = new THREE.Group();
    lid.position.set(0, 0, BOX_D / 2);

    const lidMesh = new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W + 0.08, LID_H, BOX_D + 0.08),
      lidMat
    );
    lidMesh.position.y = LID_H / 2;
    lidMesh.castShadow = true;
    lid.add(lidMesh);

    const lidBandX = new THREE.Mesh(
      new THREE.BoxGeometry(RIBBON, LID_H + 0.02, BOX_D + 0.1),
      ribbonMat
    );
    lidBandX.position.y = LID_H / 2;
    lid.add(lidBandX);

    const lidBandZ = new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W + 0.1, LID_H + 0.02, RIBBON),
      ribbonMat
    );
    lidBandZ.position.y = LID_H / 2;
    lid.add(lidBandZ);

    // Bow
    const bow = new THREE.Group();
    bow.position.y = LID_H + 0.02;

    const knot = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 16, 16),
      ribbonMat
    );
    knot.castShadow = true;
    bow.add(knot);

    function makeLoop(xSign) {
      const loop = new THREE.Mesh(
        new THREE.TorusGeometry(0.22, 0.07, 12, 24),
        ribbonMat
      );
      loop.scale.set(1.1, 0.7, 1);
      loop.rotation.y = Math.PI / 2;
      loop.rotation.z = xSign * 0.35;
      loop.position.set(xSign * 0.22, 0.05, 0);
      loop.castShadow = true;
      return loop;
    }
    bow.add(makeLoop(1), makeLoop(-1));

    const tailL = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.35, 0.06),
      ribbonMat
    );
    tailL.position.set(-0.12, -0.12, 0.08);
    tailL.rotation.z = 0.4;
    bow.add(tailL);

    const tailR = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.35, 0.06),
      ribbonMat
    );
    tailR.position.set(0.12, -0.12, 0.08);
    tailR.rotation.z = -0.4;
    bow.add(tailR);

    lid.add(bow);
    lidPivot.add(lid);

    // Inner glow when open
    const innerLight = new THREE.PointLight(0xffe0a0, 0, 4);
    innerLight.position.set(0, BOX_H * 0.5, 0);
    gift.add(innerLight);

    // Floating particles
    const particleCount = isMobile() ? 22 : 40;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    const pPhase = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      pPos[i * 3] = (Math.random() - 0.5) * 6;
      pPos[i * 3 + 1] = Math.random() * 4 + 0.5;
      pPos[i * 3 + 2] = (Math.random() - 0.5) * 6;
      pPhase[i] = Math.random() * Math.PI * 2;
    }
    pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(
      pGeo,
      new THREE.PointsMaterial({
        color: 0xf0c75e,
        size: 0.06,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
      })
    );
    scene.add(particles);

    // Animation state
    const clock = new THREE.Clock();
    let giftAppearT = 0;
    let openT = 0;
    let opening = false;
    let opened = false;

    // Resize (visualViewport helps mobile browser chrome)
    function resize() {
      const vv = window.visualViewport;
      const w = Math.round(vv ? vv.width : window.innerWidth);
      const h = Math.round(vv ? vv.height : window.innerHeight);
      camera.aspect = w / h;
      camera.fov = isMobile() ? 48 : 42;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile() ? 1.75 : 2));
      if (!opening && !opened) setGiftCamera(true);
    }
    resize();
    window.addEventListener("resize", resize);
    window.visualViewport?.addEventListener("resize", resize);
    let idleSpin = 0;
    const targetRot = { x: 0, y: 0 };
    const mouse = { x: 0, y: 0 };

    window.addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    // Raycaster for tap
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // Tap anywhere in gift phase (easier on phones); prefer gift hit when possible
    function onPointerDown(e) {
      if (phase !== "gift" || opening || opened) return;
      e.preventDefault();
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(gift.children, true);
      // On mobile, allow tap near gift / anywhere on canvas
      if (hits.length || isMobile()) openGift();
    }
    renderer.domElement.addEventListener("pointerdown", onPointerDown, { passive: false });

    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function showGift() {
      phase = "gift";
      giftReady = true;
      giftAppearT = 0;
      hint.classList.add("show");
    }

    function openGift() {
      if (opening || opened) return;
      opening = true;
      phase = "opened";
      hint.classList.remove("show");
      hint.classList.add("hide");
      openT = 0;
      burstSparkles();
    }

    function burstSparkles() {
      sparkles.classList.add("on");
      sparkles.innerHTML = "";
      const colors = ["#f0c75e", "#ff6b9d", "#fff8f0", "#e8a0ff"];
      for (let i = 0; i < 36; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        s.style.left = Math.random() * 100 + "%";
        s.style.background = colors[i % colors.length];
        s.style.width = s.style.height = 4 + Math.random() * 6 + "px";
        s.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
        s.style.animationDelay = Math.random() * 0.4 + "s";
        sparkles.appendChild(s);
      }
      setTimeout(() => {
        sparkles.classList.remove("on");
        sparkles.innerHTML = "";
      }, 3500);
    }

    openBtn.addEventListener("click", () => {
      if (phase !== "intro") return;
      intro.classList.add("hiding");
      setTimeout(showGift, 500);
    });

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // Particles drift
      const pos = particles.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        pos[i * 3 + 1] += Math.sin(t + pPhase[i]) * 0.002;
        pos[i * 3] += Math.cos(t * 0.4 + pPhase[i]) * 0.001;
      }
      particles.geometry.attributes.position.needsUpdate = true;
      particles.rotation.y = t * 0.02;

      glow.material.opacity = 0.12 + Math.sin(t * 1.5) * 0.06;
      glow.scale.setScalar(1 + Math.sin(t * 1.2) * 0.08);

      if (giftReady) {
        // Appear
        if (giftAppearT < 1) {
          giftAppearT = Math.min(1, giftAppearT + dt * 1.1);
          const e = easeOutBack(giftAppearT);
          gift.scale.setScalar(e);
          gift.position.y = (1 - e) * -0.8;
        } else if (!opening && !opened) {
          idleSpin += dt;
          gift.rotation.y = Math.sin(idleSpin * 0.7) * 0.25;
          gift.position.y = Math.sin(idleSpin * 1.4) * 0.06;
          targetRot.x = mouse.y * 0.12;
          targetRot.y = mouse.x * 0.2;
          gift.rotation.x += (targetRot.x - gift.rotation.x) * 0.05;
          gift.rotation.y += (Math.sin(idleSpin * 0.7) * 0.25 + targetRot.y - gift.rotation.y) * 0.05;
        }

        if (opening || opened) {
          openT = Math.min(1, openT + dt * 0.55);
          const e = easeInOutCubic(openT);

          // Lid flips open backward
          lidPivot.rotation.x = -e * (Math.PI * 0.78);
          lidPivot.position.y = BOX_H + e * 0.15;

          // Box settles + slight push down
          gift.rotation.x *= 0.92;
          gift.rotation.y += (0.35 - gift.rotation.y) * 0.04;
          gift.position.y += (0 - gift.position.y) * 0.06;

          // Inner light blooms
          innerLight.intensity = e * 28;

          // Camera eases in a bit (portrait-friendly on phones)
          const mobile = isMobile();
          const tz = mobile ? 5.8 : 5.2;
          const ty = mobile ? 2.1 : 1.8;
          const lookY = mobile ? 0.85 : 0.7;
          camera.position.z += (tz - camera.position.z) * 0.03;
          camera.position.y += (ty - camera.position.y) * 0.03;
          camera.lookAt(0, lookY, 0);

          if (openT > 0.55 && !opened) {
            opened = true;
            reveal.classList.add("show");
          }

          if (openT >= 1) opening = false;
        }
      }

      // Soft camera bob during gift phase
      if (phase === "gift" && !opening) {
        camera.position.x = Math.sin(t * 0.35) * (isMobile() ? 0.08 : 0.15);
        camera.lookAt(0, isMobile() ? 0.85 : 0.6, 0);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
